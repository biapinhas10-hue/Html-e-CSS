<body>
    <h1>Cotação de Seguro de Veículo</h1>
</body>

<fieldset>
    <legend>Condutor</legend>
    <label for="text">Nome do Propriétario:</label>
    <input type="text">
    <br>
    <br>
    <label for="text">CNH:</label>
    <input type="text">
    <br>
    <br>
    <label for="text">Data de Emissão da CNH:</label>
    <input type="date">
    <br>
    <br>
    <input type="radio" id="solteiro" name="relacao" value="op1">
    <label for="tex">Solteiro</label>
    <input type="radio" id="casado" name="relacao" value="op2">
    <label for="text">Casado</label>
    <input type="radio" id="divorciado" name="relacao" value="op3">
    <label for="text">Divorciado</label>
    <input type="radio" id="viuvo" name="relacao" value="op4">
    <label for="text">Viúvo</label>
</fieldset>
<br>
<fieldset>
    <legend>Veículo</legend>
    <label for="text">Placa de Carro:</label>
    <input type="text" placeholder="ABC-1234">
    <br>
    <br>
    <label for="text">Marca do Veiculo:</label>
    <select>
         <option>Fiat</option>
         <option>Spin</option>
        <option>Jeep</option>
    </select>
    <br>
    <br>
    <label for="text">Ano do Modelo:</label>
    <input type="text">
    <br>
    <br>
</fieldset>
<fieldset>
    <legend>Uso</legend>
    <legend>Usa o carro para trabalho (uber/Taxi)?</legend>
    <br>
    <label for="text">Sim</label>
    <input type="radio" id="sim" name="fi" value="op1">
    <label for="text">Não</label>
    <input type="radio" id="veiculo" name="fi" value="op2">
    <br>
    <br>
    <input type="checkbox">
    <label for="text">Possui rastreador instalado</label>
</fieldset>
<br>
<button>Solicitar Cotação</button>
